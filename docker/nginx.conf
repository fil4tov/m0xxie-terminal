server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing audio and bundles must return 404 rather than the HTML page.
    location ~* \.(?:js|css|map|mp3|wav|ogg|oga|m4a|aac|flac|opus|webm)$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
